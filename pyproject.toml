[project]
name = "repodb"
version = "0.2.0"
description = "Keep a SQLite database of git project clone URLs; clone, compare and change the projects in bulk"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["git", "github", "sqlite", "clone", "cli"]
# This project intentionally has no runtime dependencies.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]

[project.scripts]
repodb = "repodb.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "twine>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repodb"
module-root = "src"
source-include = ["tests/**", "CHANGELOG.md", "LICENSE"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on any warning, so a leaked sqlite connection (ResourceWarning) fails CI.
filterwarnings = ["error"]

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
strict = true

# Tests may omit annotations; their bodies are still type-checked. mypy
# names tests/*.py by file stem (tests/ is not a package), so list each module.
[[tool.mypy.overrides]]
module = ["conftest", "test_repodb", "test_apply", "test_library"]
disallow_untyped_defs = false
disallow_untyped_calls = false
